<div 
  class="item-card"
  hoverHighlight
  [ngClass]="{ 'discount-green': item.newPrice < 6000 }">
  <div class="badge-area">
    <div 
      *ngIf="(item.oldPrice - item.newPrice) / item.oldPrice > 0.3"
      class="best-price">
      КРАЩА ЦІНА!
    </div>
  </div>
  <img 
    class="item-image"
    [src]="item.imageUrl" 
    alt="image">

<h3>{{ item.title | truncate:22 }}</h3>

  <p>Магазин: {{ item.store }}</p>

  <p>Стара ціна: 
    <s>{{ item.oldPrice }} грн</s>
  </p>

  <p><b>Нова ціна: {{ item.newPrice }} грн</b></p>

  <p>Діє до: {{ item.validUntil }}</p>

<button
  class="details-btn"
  [routerLink]="['/items', item.id]">
  Детальніше
</button>
</div>
